version: 2

project_name: semver

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: semver
    main: .
    binary: semver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: semver
    ids:
      - semver
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor\\(test\\):"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other work
      order: 999

homebrew_casks:
  - name: semver
    ids:
      - semver
    binaries:
      - semver
    homepage: "https://github.com/gozeloglu/semver"
    description: "A CLI tool to manage semantic versioning with tags and pushes"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore: bump semver to {{ .Tag }}"
    repository:
      owner: gozeloglu
      name: homebrew-tap
      branch: main
      # The workflow scoped GITHUB_TOKEN cannot write to another repository.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        # The binary is neither signed nor notarized, so strip the quarantine
        # attribute macOS adds to downloads. Without this, Gatekeeper reports
        # the binary as damaged.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/semver"]
          end

release:
  footer: |
    ## Installation

    ```bash
    brew install gozeloglu/tap/semver
    ```

    **Full changelog**: https://github.com/gozeloglu/semver/compare/{{ .PreviousTag }}...{{ .Tag }}
